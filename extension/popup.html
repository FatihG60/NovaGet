<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      margin: 0;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B1120;
      color: #F8FAFC;
    }
    header {
      padding: 12px 16px;
      background: #111827;
      border-bottom: 1px solid #1E293B;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #38BDF8, #818CF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .pill {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .ok { background: rgba(6, 78, 59, 0.7); color: #34D399; border: 1px solid #059669; }
    .ok .dot { background: #34D399; box-shadow: 0 0 6px #34D399; }
    .bad { background: rgba(69, 10, 10, 0.7); color: #FCA5A5; border: 1px solid #DC2626; }
    .bad .dot { background: #EF4444; }

    section {
      padding: 14px 16px;
      border-bottom: 1px solid #1E293B;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 12px;
      color: #94A3B8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-count {
      background: #1E293B;
      color: #38BDF8;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 8px;
    }

    #mediaList {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
    }
    .media-card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s ease;
    }
    .media-card:hover {
      border-color: #38BDF8;
    }
    .media-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .media-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #F1F5F9;
      word-break: break-word;
      line-height: 1.3;
    }
    .format-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .format-HLS-MASTER { background: #4F46E5; color: #EEF2FF; }
    .format-HLS-VIDEO { background: #0284C7; color: #E0F2FE; }
    .format-HLS-AUDIO { background: #D97706; color: #FEF3C7; }
    .format-HLS { background: #4338CA; color: #E0E7FF; }
    .format-DASH { background: #6D28D9; color: #EDE9FE; }
    .format-MP4 { background: #0369A1; color: #E0F2FE; }
    .format-WebM { background: #0F766E; color: #CCFBF1; }
    .format-AUDIO { background: #B45309; color: #FEF3C7; }
    .format-VIDEO { background: #374151; color: #F3F4F6; }

    .media-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
    }
    .media-size {
      font-size: 11.5px;
      color: #94A3B8;
      font-variant-numeric: tabular-nums;
    }
    .action-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .quality-select {
      background: #0F172A;
      color: #E2E8F0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 11px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .quality-select:focus, .quality-select:hover {
      border-color: #38BDF8;
    }
    .btn-download {
      background: linear-gradient(135deg, #0284C7, #2563EB);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn-download:hover {
      background: linear-gradient(135deg, #0369A1, #1D4ED8);
      transform: translateY(-1px);
    }
    .btn-download:active {
      transform: translateY(0);
    }
    .empty-state {
      padding: 20px 10px;
      text-align: center;
      color: #64748B;
      font-size: 12px;
      line-height: 1.5;
    }

    /* Settings section */
    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #CBD5E1;
      font-size: 12px;
      cursor: pointer;
    }
    .input-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-row span {
      font-size: 11px;
      color: #94A3B8;
    }
    input[type=text], input[type=number] {
      width: 100%;
      background: #0F172A;
      color: #F8FAFC;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 12px;
    }
    input[type=text]:focus, input[type=number]:focus {
      outline: none;
      border-color: #38BDF8;
    }
    .btn-save {
      background: #334155;
      color: #F8FAFC;
      border: 0;
      border-radius: 6px;
      padding: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-save:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon32.png" alt="NovaGet">
      <h1>NovaGet</h1>
    </div>
    <div id="status" class="pill bad">
      <span class="dot"></span>
      <span id="statusText">Bağlanıyor…</span>
    </div>
  </header>

  <section>
    <div class="section-header">
      <h2>Bu Sekmedeki Medyalar</h2>
      <span id="mediaCount" class="badge-count">0</span>
    </div>
    <div id="mediaList">
      <div class="empty-state">
        Henüz medya akışı tespit edilmedi.<br>
        Sayfada bir video/ses oynatıldığında otomatik yakalanır.
      </div>
    </div>
  </section>

  <section>
    <div class="section-header">
      <h2>İndirme Devralma Ayarları</h2>
    </div>
    <div class="settings-group">
      <label>
        <input type="checkbox" id="enabled">
        <span>Tarayıcı indirmelerini otomatik devral</span>
      </label>
      <div class="input-row">
        <span>Minimum Dosya Boyutu (MB)</span>
        <input type="number" id="minSizeMB" min="0">
      </div>
      <div class="input-row">
        <span>Devralınacak Dosya Uzantıları</span>
        <input type="text" id="extensions">
      </div>
      <button id="save" class="btn-save">Ayarları Kaydet</button>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
