<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 376px;
      margin: 0;
      font: 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", Inter, "Segoe UI", sans-serif;
      background: #0A0B0E;
      color: #EDEDEF;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 10px 14px;
      background: #0F1117;
      border-bottom: 1px solid #1C202B;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand img {
      width: 18px;
      height: 18px;
      border-radius: 4px;
    }
    .brand h1 {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #EDEDEF;
    }
    .pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #14171F;
      border: 1px solid #1C202B;
      color: #8A8F9E;
    }
    .pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .ok .dot { background: #10B981; }
    .bad .dot { background: #EF4444; }

    section {
      padding: 12px 14px;
      border-bottom: 1px solid #1C202B;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }
    h2 {
      font-size: 11px;
      color: #8A8F9E;
      font-weight: 600;
    }
    .badge-count {
      background: #14171F;
      border: 1px solid #1C202B;
      color: #8A8F9E;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
    }

    #mediaList {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
    }
    .media-card {
      background: #0F1117;
      border: 1px solid #1C202B;
      border-radius: 5px;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s ease;
    }
    .media-card:hover {
      border-color: #282E3D;
    }
    .media-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .media-title {
      font-size: 12px;
      font-weight: 500;
      color: #EDEDEF;
      word-break: break-word;
      line-height: 1.35;
    }
    .format-tag {
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 9.5px;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      white-space: nowrap;
      background: #171A24;
      border: 1px solid #262B38;
      color: #8A8F9E;
    }

    .media-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
    }
    .media-size {
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
      color: #8A8F9E;
      font-variant-numeric: tabular-nums;
    }
    .action-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .quality-select {
      background: #14171F;
      color: #D4D7E0;
      border: 1px solid #262B38;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 11px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }
    .quality-select:focus, .quality-select:hover {
      border-color: #353C4F;
    }
    .btn-download {
      background: #2563EB;
      color: #fff;
      border: 1px solid #3B82F6;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s ease;
    }
    .btn-download:hover {
      background: #1D4ED8;
    }
    .empty-state {
      padding: 18px 10px;
      text-align: center;
      color: #565B6A;
      font-size: 11.5px;
      line-height: 1.5;
    }

    /* Settings section */
    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #D4D7E0;
      font-size: 11.5px;
      cursor: pointer;
    }
    .input-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-row span {
      font-size: 11px;
      color: #8A8F9E;
    }
    input[type=text], input[type=number] {
      width: 100%;
      background: #0F1117;
      color: #EDEDEF;
      border: 1px solid #262B38;
      border-radius: 4px;
      padding: 6px 8px;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11.5px;
    }
    input[type=text]:focus, input[type=number]:focus {
      outline: none;
      border-color: #3B82F6;
    }
    .btn-save {
      background: #171A24;
      color: #D4D7E0;
      border: 1px solid #262B38;
      border-radius: 4px;
      padding: 7px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn-save:hover {
      background: #1E2230;
      border-color: #353C4F;
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon32.png" alt="NovaGet">
      <h1>NovaGet</h1>
    </div>
    <div id="status" class="pill bad">
      <span class="dot"></span>
      <span id="statusText">Bağlanıyor…</span>
    </div>
  </header>

  <section>
    <div class="section-header">
      <h2>Bu Sekmedeki Medya Akışları</h2>
      <span id="mediaCount" class="badge-count">0</span>
    </div>
    <div id="mediaList">
      <div class="empty-state">
        Henüz medya akışı tespit edilmedi.<br>
        Sayfada bir video veya ses oynatıldığında otomatik yakalanır.
      </div>
    </div>
  </section>

  <section>
    <div class="section-header">
      <h2>İndirme Devralma Ayarları</h2>
    </div>
    <div class="settings-group">
      <label>
        <input type="checkbox" id="enabled">
        <span>Tarayıcı indirmelerini otomatik devral</span>
      </label>
      <div class="input-row">
        <span>Minimum Dosya Boyutu (MB)</span>
        <input type="number" id="minSizeMB" min="0">
      </div>
      <div class="input-row">
        <span>Devralınacak Dosya Uzantıları</span>
        <input type="text" id="extensions">
      </div>
      <button id="save" class="btn-save">Ayarları Kaydet</button>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
